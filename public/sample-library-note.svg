  <g fill="#102027" font-family="Georgia,serif"><text x="112" y="220" font-size="38">History seminar</text><text x="112" y="274" font-size="22">Library note · 14 October</text><text x="112" y="374" font-size="30">The library closes at nine.</text><text x="112" y="428" font-size="30">Bring the primary source notes</text><text x="112" y="482" font-size="30">to the seminar.</text><text x="112" y="620" font-size="30">The archive copy has a torn</text><text x="112" y="674" font-size="30">lower margin, so check the</text><text x="112" y="728" font-size="30">final date against the source</text><text x="112" y="782" font-size="30">page before quoting it.</text></g>
